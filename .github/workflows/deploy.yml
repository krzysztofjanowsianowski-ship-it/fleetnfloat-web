# Automatyczne wdrożenie www.fnfgroup.pl po każdej zmianie w gałęzi main.
# Wymaga sekretów DEPLOY_SSH_KEY i DEPLOY_KNOWN_HOSTS (patrz README, „Automatyczne wdrażanie”).
name: Wdrożenie www.fnfgroup.pl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fnfgroup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Budowanie strony
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Wysłanie na serwer
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Brak sekretów DEPLOY_SSH_KEY lub DEPLOY_KNOWN_HOSTS. Instrukcja w README, sekcja Automatyczne wdrażanie."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Klucz można wkleić jako blok BEGIN/END albo jako jedną linię base64 (wypisuje ją setup-autodeploy.sh).
          KEY=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')
          case "$KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) printf '%s\n' "$KEY" > ~/.ssh/deploy_key ;;
            *) printf '%s' "$KEY" | tr -d ' \n\t' | base64 -d > ~/.ssh/deploy_key ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::Sekret DEPLOY_SSH_KEY nie jest poprawnym kluczem. Wklej go ponownie jako jedną linię base64 (README, Automatyczne wdrażanie)."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          tar -C dist -czf - . | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@91.107.222.145

      - name: Sprawdzenie strony
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://www.fnfgroup.pl/
